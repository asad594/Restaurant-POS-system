{% extends "base.html" %}

{% block title %}Dashboard Analytics - Restaurant POS{% endblock %}

{% block content %}
<div id="analytics-dashboard-page" class="dashboard-screen">
    <h1 class="dashboard-title"><i class="fa-solid fa-chart-simple"></i> Sales Analytics Dashboard</h1>

    <!-- KPI Metric Cards Grid -->
    <div class="stats-grid">
        <!-- Revenue Card -->
        <div class="stat-card">
            <div class="stat-icon-wrapper">
                <i class="fa-solid fa-sack-dollar"></i>
            </div>
            <div class="stat-info">
                <span class="stat-label">Today's Revenue</span>
                <span class="stat-val" id="today-sales">Rs. 0.00</span>
            </div>
        </div>

        <!-- Orders Count Card -->
        <div class="stat-card">
            <div class="stat-icon-wrapper orders">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="stat-info">
                <span class="stat-label">Today's Orders</span>
                <span class="stat-val" id="today-orders">0</span>
            </div>
        </div>
    </div>

    <!-- Charts & Table Columns Grid -->
    <div class="dashboard-grid">
        <!-- Revenue Bar Chart -->
        <div class="chart-card">
            <h2 class="card-title"><i class="fa-regular fa-calendar-check"></i> 7-Day Revenue Trend</h2>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <!-- Top Selling Items Table -->
        <div class="table-card">
            <h2 class="card-title"><i class="fa-solid fa-fire"></i> Top 5 Selling Items</h2>
            <div style="overflow-x: auto;">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Item</th>
                            <th>Qty Sold</th>
                            <th>Revenue</th>
                        </tr>
                    </thead>
                    <tbody id="top-items-body">
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                                <i class="fa-solid fa-circle-notch fa-spin"></i> Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
